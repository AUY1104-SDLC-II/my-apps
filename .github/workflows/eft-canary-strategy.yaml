name: EFT - Pipeline Canary completo

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: canary-orders-deployment
  cancel-in-progress: false

jobs:
  build:
    uses: AUY1104-SDLC-II/devops-library/.github/workflows/eft-docker-deploy.yaml@v2.0.2
    with:
      image_name: auy1104-app
    secrets: inherit

  deploy:
    needs: build
    uses: AUY1104-SDLC-II/devops-library/.github/workflows/eft-canary-deploy.yaml@v2.0.2
    with:
      stable_image: mafernandezz/auy1104-app@sha256:2d0d89ec5ad81b1a2f609d0cc061bbb1c2a95a2d2094969af2ec740ea9c3432a
      server_ip: ${{ vars.K3S_SERVER_PUBLIC_IP }}
      image_name: auy1104-app
    secrets: inherit