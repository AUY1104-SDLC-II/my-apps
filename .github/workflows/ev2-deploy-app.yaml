name: EA3 - Deploy con rollout status y rollback automático

on:
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run tests
        run: npm ci && npm test

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/auy1104-app:latest
            ${{ secrets.DOCKER_USERNAME }}/auy1104-app:${{ github.sha }}

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    env:
      SERVER_IP: ${{ vars.K3S_SERVER_PUBLIC_IP }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Start SSH Agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.EA2_SSH_PRIVATE_KEY }}

      - name: Render k8s manifest with Docker username
        run: |
          sed "s|DOCKER_USERNAME_PLACEHOLDER|${{ secrets.DOCKER_USERNAME }}|g" \
            k8s/app-stack.yaml > /tmp/app-stack-rendered.yaml

      - name: Copy manifest to k3s server
        run: |
          scp -o StrictHostKeyChecking=accept-new \
            /tmp/app-stack-rendered.yaml ubuntu@${SERVER_IP}:/tmp/app-stack.yaml

#      - name: Deploy to k3s
#        id: deploy
#        run: |
#          ssh -o StrictHostKeyChecking=accept-new ubuntu@${SERVER_IP} << 'EOF'
#          set -e
#          sudo k3s kubectl apply -f /tmp/app-stack.yaml -n default
#          sudo k3s kubectl rollout status deployment/my-app-deployment \
#            -n default --timeout=60s
#          EOF
      - name: Deploy to k3s
        id: deploy
        run: |
          ssh -o StrictHostKeyChecking=accept-new ubuntu@${SERVER_IP} << 'EOF'
          set -e
          echo "Forzando imagen inexistente para probar rollback automático..."
          sudo k3s kubectl set image deployment/my-app-deployment \
            my-app=${{ secrets.DOCKER_USERNAME }}/auy1104-app:tag-no-existe-v999 \
            -n default

          sudo k3s kubectl rollout status deployment/my-app-deployment \
            -n default --timeout=60s
          EOF

      - name: Rollback automático
        if: failure()
        run: |
          echo "Fallo detectado — iniciando rollback automático..."
          ssh -o StrictHostKeyChecking=accept-new ubuntu@${SERVER_IP} << 'EOF'
          set -e
          sudo k3s kubectl rollout undo deployment/my-app-deployment -n default
          sudo k3s kubectl rollout status deployment/my-app-deployment \
            -n default --timeout=60s
          sudo k3s kubectl get pods -n default
          EOF

      - name: Verify /health endpoint
        run: |
          sleep 10
          curl -f http://${SERVER_IP}:30090/health