name: EV2 - Deploy App Principal (puerto 30090)

on:
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/auy1104-app:latest
            ${{ secrets.DOCKER_USERNAME }}/auy1104-app:${{ github.sha }}

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    env:
      SERVER_IP: ${{ vars.K3S_SERVER_PUBLIC_IP }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Start SSH Agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.EA2_SSH_PRIVATE_KEY }}

      - name: Render k8s manifest with Docker username
        run: |
          sed "s|DOCKER_USERNAME_PLACEHOLDER|${{ secrets.DOCKER_USERNAME }}|g" k8s/app-stack.yaml > /tmp/app-stack-rendered.yaml
          cat /tmp/app-stack-rendered.yaml

      - name: Copy manifest to k3s server
        run: |
          scp -o StrictHostKeyChecking=accept-new /tmp/app-stack-rendered.yaml ubuntu@${SERVER_IP}:/tmp/app-stack.yaml

      - name: Apply manifest in k3s
        run: |
          ssh -o StrictHostKeyChecking=accept-new ubuntu@${SERVER_IP} << 'EOF'
          set -e

          # Eliminar recursos anteriores si existen
          sudo k3s kubectl delete deployment my-app-deployment -n default --ignore-not-found
          sudo k3s kubectl delete service my-app-service -n default --ignore-not-found

          # Aplicar nuevo manifiesto
          sudo k3s kubectl apply -f /tmp/app-stack.yaml -n default

          # Esperar a que el deployment esté listo
          sudo k3s kubectl rollout status deployment/my-app-deployment -n default --timeout=180s
          EOF

      - name: Verify /health endpoint
        run: |
          sleep 10
          curl -f http://${SERVER_IP}:30090/health

      - name: Rollback on failure
        if: failure()
        run: |
          echo "Fallo detectado, intentando rollback..."
          ssh -o StrictHostKeyChecking=accept-new ubuntu@${SERVER_IP} << 'EOF'
          set -e
          sudo k3s kubectl rollout undo deployment/my-app-deployment -n default
          sudo k3s kubectl rollout status deployment/my-app-deployment -n default --timeout=180s
          EOF