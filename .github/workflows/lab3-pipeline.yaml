name: Lab 3.1 - Fail Fast Pipeline

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

jobs:
  deps-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Instalar dependencias
        run: npm ci

      - name: Ejecutar tests
        run: npm test

  build-and-push:
    needs: deps-and-test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Login a Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Armar la imagen y publicarla
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/demo-api:${{ github.ref_name }}

  deploy-to-k8s:
    needs: build-and-push
    runs-on: ubuntu-latest
    env:
      SERVER_IP: ${{ vars.K3S_SERVER_PUBLIC_IP }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Start SSH Agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.EA2_SSH_PRIVATE_KEY }}

      - name: Render manifest
        run: |
          sed "s|DOCKER_USERNAME_PLACEHOLDER|${{ secrets.DOCKER_USERNAME }}|g" k8s/app-stack.yaml > /tmp/app-stack-rendered.yaml

      - name: Copy manifest to k3s
        run: |
          scp -o StrictHostKeyChecking=accept-new /tmp/app-stack-rendered.yaml ubuntu@${SERVER_IP}:/tmp/app-stack.yaml

      - name: Apply manifest in k3s
        run: |
          ssh -o StrictHostKeyChecking=accept-new ubuntu@${SERVER_IP} << 'EOF'
          set -e
          sudo k3s kubectl apply -f /tmp/app-stack.yaml -n default
          sudo k3s kubectl rollout status deployment/my-app-deployment -n default --timeout=180s
          EOF