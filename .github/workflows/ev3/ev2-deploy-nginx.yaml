name: "EV2 — Deploy nginx puerto 30080"

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy-nginx:
    name: "Deploy nginx to k3s — puerto 30080"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup SSH Agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.EA2_SSH_PRIVATE_KEY }}

      - name: Set Server IP
        run: |
          FINAL_IP="${{ vars.K3S_SERVER_PUBLIC_IP }}"
          if [ -z "$FINAL_IP" ]; then
            echo "❌ ERROR: Configura la variable K3S_SERVER_PUBLIC_IP en Settings del repo"
            exit 1
          fi
          echo "SERVER_IP=$FINAL_IP" >> $GITHUB_ENV

      - name: Apply nginx Manifest
        run: |
          scp -o StrictHostKeyChecking=accept-new \
            k8s/nginx-stack.yaml ubuntu@${SERVER_IP}:/tmp/nginx-stack.yaml
          ssh -o StrictHostKeyChecking=accept-new ubuntu@${SERVER_IP} \
            "sudo k3s kubectl apply -f /tmp/nginx-stack.yaml && \
             sudo k3s kubectl rollout status deployment/nginx-deployment --timeout=120s"

      - name: Verify nginx puerto 30080
        run: |
          sleep 10
          curl -f http://${SERVER_IP}:30080

      - name: Rollback on Failure
        if: failure()
        run: |
          ssh -o StrictHostKeyChecking=accept-new ubuntu@${SERVER_IP} \
            'sudo k3s kubectl rollout undo deployment/nginx-deployment || true'
          exit 1