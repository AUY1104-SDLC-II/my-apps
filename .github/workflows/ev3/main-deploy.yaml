name: Client API Deployment

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

jobs:
  deps-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Instalar Dependencias
        run: npm ci

      - name: Ejecutar Pruebas Unitarias
        run: npm test

  build-and-push:
    runs-on: ubuntu-latest
    needs: deps-and-test
    steps:
      - name: Checkout Código
        uses: actions/checkout@v4

      - name: Configurar QEMU y Docker Buildx
        uses: actions/setup-qemu-action@v3
        with:
          platforms: 'all'

      - name: Login en Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Construir y Publicar Imagen
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/demo-api:${{ github.ref_name }}

  deploy-to-k8s:
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
      - name: Simulación de Despliegue CD
        run: |
          echo "Desplegando versión ${{ github.ref_name }} en el clúster K3s..."
          echo "Ejecutando actualización declarativa sobre el namespace lab32"