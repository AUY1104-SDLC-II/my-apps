name: EFT - Deploy estrategia Canary en k8s

on:
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run tests
        run: npm ci && npm test

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/auy1104-app:${{ github.sha }}

  deploy-canary:
    needs: build-and-push
    runs-on: ubuntu-latest
    env:
      SERVER_IP: ${{ vars.K3S_SERVER_PUBLIC_IP }}
      STABLE_IMAGE: mafernandezz/auy1104-app@sha256:8cf9ad3c7a1ae510034a85eaa00107edf167ac785e29165e8f5985581c5c59b4
      CANARY_IMAGE: ${{ secrets.DOCKER_USERNAME }}/auy1104-app:${{ github.sha }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Start SSH Agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.EA2_SSH_PRIVATE_KEY }}

      - name: Render Canary manifests
        run: |
          set -e
          sed "s|STABLE_IMAGE_PLACEHOLDER|${STABLE_IMAGE}|g" \
            k8s/canary-stable-deployment.yaml \
            > /tmp/canary-stable-deployment.yaml
          
          sed "s|CANARY_IMAGE_PLACEHOLDER|${CANARY_IMAGE}|g" \
            k8s/canary-deployment.yaml \
            > /tmp/canary-deployment.yaml
          
      - name: Copy Canary manifest to k3s server
        run: |
          scp -o StrictHostKeyChecking=accept-new \
            k8s/canary-namespace.yaml \
            /tmp/canary-stable-deployment.yaml \
            /tmp/canary-deployment.yaml \
            k8s/canary-service.yaml \
            ubuntu@${SERVER_IP}:/tmp/

      - name: Deploy Canary stack to K3s
        run: |
          ssh -o StrictHostKeyChecking=accept-new ubuntu@${SERVER_IP} << 'EOF'
          set -e
          #Implementar manifiestos
          sudo k3s kubectl apply -f /tmp/canary-namespace.yaml
          sudo k3s kubectl apply -f /tmp/canary-stable-deployment.yaml
          sudo k3s kubectl apply -f /tmp/canary-deployment.yaml
          sudo k3s kubectl apply -f /tmp/canary-service.yaml
          
          #Validar funcionamiento
          sudo k3s kubectl get deployments -n canary-orders
          sudo k3s kubectl get pods -n canary-orders --show-labels
          sudo k3s kubectl get svc -n canary-orders
          EOF

      - name: Verify /health endpoint
        run: |
          sleep 30
          curl -f http://${SERVER_IP}:30080/health