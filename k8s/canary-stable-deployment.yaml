apiVersion: apps/v1
kind: Deployment
metadata:
  name: orders-api-stable
  namespace: canary-orders
  labels:
    app: orders-api
    environment: dev
    strategy: canary
    track: stable
spec:
  replicas: 3
  selector:
    matchLabels:
      app: orders-api
      track: stable
  template:
    metadata:
      labels:
        app: orders-api
        environment: dev
        strategy: canary
        track: stable
    spec:
      containers:
        - name: orders-api
          image: nginx:stable
          imagePullPolicy: Always
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 3