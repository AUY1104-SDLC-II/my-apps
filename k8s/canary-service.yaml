apiVersion: v1
kind: Service
metadata:
  name: orders-api-service
  namespace: canary-orders
  labels:
    app: orders-api
    environment: dev
    strategy: canary
spec:
  type: NodePort
  selector:
    app: orders-api
    track: stable
  ports:
    - port: 3000
      targetPort: 3000
      nodePort: 30080
---
apiVersion: v1
kind: Service
metadata:
  name: orders-api-canary-validation
  namespace: canary-orders
  labels:
    app: orders-api
    environment: dev
    strategy: canary
spec:
  type: ClusterIP
  selector:
    app: orders-api
    track: canary
  ports:
    - port: 3000
      targetPort: 3000