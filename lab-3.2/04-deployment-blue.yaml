apiVersion: apps/v1
kind: Deployment
metadata:
  name: demo-api-blue
  namespace: lab32
spec:
  replicas: 3
  selector:
    matchLabels:
      app: demo-api
      slot: blue
  template:
    metadata:
      labels:
        app: demo-api
        slot: blue
    spec:
      containers:
        - name: api
          image: asanchezoduoc/demo-api:latest
          ports:
            - containerPort: 3000
          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
